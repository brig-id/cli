version: 2

# One pull request a week for everything this repository depends on, all
# ecosystems together: Dependabot opens no other.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies

updates:
  - package-ecosystem: cargo
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
