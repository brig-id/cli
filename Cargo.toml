[package]
name = "brigid"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
rust-version = "1.85"
description = "brig·id dev orchestrator — prerequisite checks, local HTTPS/master-key setup, and split-pane process launcher"

[[bin]]
name = "brigid"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
inquire = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"

[profile.release]
panic = "abort"
